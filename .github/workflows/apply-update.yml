name: Apply update from issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: apply-update
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.number >= 2 &&
      (
        github.event.comment.user.login == github.repository_owner ||
        github.event.comment.user.login == 'dust-agent[bot]'
      ) &&
      (
        startsWith(github.event.comment.body, 'FABLE-APPLY ') ||
        startsWith(github.event.comment.body, 'FABLE-APPLY-APP ')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      BODY: ${{ github.event.comment.body }}
      OWNER: ${{ github.repository_owner }}
      BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUM: ${{ github.event.issue.number }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download and verify the new version
        run: |
          read -r CMD VERSION SHA256 _rest <<< "$(printf '%s\n' "$BODY" | head -n 1 | tr -d '\r')"
          echo "CMD=$CMD" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Applying $VERSION ($SHA256) via $CMD from issue #$ISSUE_NUM"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM/comments?per_page=100" --paginate \
            --jq ".[] | select((.user.login == \"$OWNER\") or (.user.login == \"dust-agent[bot]\")) | select(.body | startswith(\"FABLE-DATA $VERSION \")) | .body" \
            | tr -d '\r' | grep -v '^FABLE-DATA' | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/fable.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/fable.tar.xz" | sha256sum -c -

      - name: Replace project files
        run: |
          cp -r .github "$RUNNER_TEMP/github-keep"
          if [ "$CMD" = "FABLE-APPLY-APP" ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name local-bloxd -exec rm -rf {} +
          else
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          tar -xJf "$RUNNER_TEMP/fable.tar.xz"
          rm -rf .github && cp -r "$RUNNER_TEMP/github-keep" .github
          chmod +x gradlew

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Apply Fable Browser $VERSION" || echo "Nothing changed."
          git push origin "HEAD:$BRANCH"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Start the APK build
        run: gh workflow run build-apk.yml --ref "$BRANCH"

      - name: Report
        if: always()
        run: |
          gh issue comment "$ISSUE_NUM" --body "FABLE-APPLIED $VERSION ${{ job.status }} commit ${COMMIT:-none} run $GITHUB_RUN_ID"
