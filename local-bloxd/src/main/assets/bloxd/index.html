@keyframes PreloadLoaderRotate{to{transform:rotate(360deg)}}
body,html{margin:0;background:#22283b;overflow:hidden;touch-action:none}
.PreloadLoader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.PreloadLoaderBox{position:relative;box-sizing:border-box;font-size:14rem;width:1em;height:1em;--border-size:min(0.8rem, 0.15em)}
.PreloadLoaderRing{position:absolute;inset:0;box-sizing:border-box;border-radius:50%;border:var(--border-size) solid #f2f2f2;border-top-color:#4f94f1;animation:PreloadLoaderRotate 1.5s linear infinite}
.PreloadLoaderBox img{position:absolute;inset:calc(var(--border-size) + var(--border-size)/ 2);width:calc(100% - var(--border-size) * 3);height:calc(100% - var(--border-size) * 3);box-sizing:border-box;border-radius:50%}
